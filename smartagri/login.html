<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SmartAgri — Trang đăng nhập dành cho nông dân">
  <title>SmartAgri — Đăng nhập cho Nông dân</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <main class="login-shell">
    <section class="visual" aria-hidden="true">
      <img class="visual-photo" src="assets/login-farmer.png" alt="">
    </section>

    <section class="form-side">
      <header class="login-head">
        <h1>Đăng nhập cho Nông dân</h1>
        <p class="divider">
          <span class="divider-line"></span>
          <svg class="divider-leaf" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M20 3c-8 0-14 4.6-14.8 11.4L3 17l1.4 1.4L6 17c6.8-.8 11.4-6.8 11.4-14h2.6z" opacity=".9"/>
            <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M5.5 18.5 14 10"/>
          </svg>
          <span class="divider-line"></span>
        </p>
      </header>

      <form class="login-card" id="loginForm" novalidate>
        <div class="field">
          <label for="username">Tên người dùng</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.1 0-7.5 2.3-7.5 5.2V21h15v-1.8C19.5 16.3 16.1 14 12 14Z"/>
              </svg>
            </span>
            <input class="input" type="text" id="username" name="username" placeholder="nongdan" autocomplete="username">
          </div>
          <span class="field-error" id="usernameError" role="alert"></span>
        </div>

        <div class="field">
          <label for="password">Mật khẩu</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M17 10V8a5 5 0 0 0-10 0v2H5.5v11h13V10H17Zm-8-2a3 3 0 0 1 6 0v2H9V8Zm2 8.7V18h2v-1.3a1.6 1.6 0 1 0-2 0Z"/>
              </svg>
            </span>
            <input class="input" type="password" id="password" name="password" placeholder="••••••" autocomplete="current-password">
            <button class="eye-btn" type="button" id="togglePassword" aria-label="Hiện mật khẩu" aria-pressed="false">
              <svg class="eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="currentColor" d="M12 5c-4.4 0-8.2 2.6-10 6.5 1.8 3.9 5.6 6.5 10 6.5s8.2-2.6 10-6.5C20.2 7.6 16.4 5 12 5Zm0 10.5A4 4 0 1 1 12 8a4 4 0 0 1 0 7.5Z"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="passwordError" role="alert"></span>
        </div>

        <p class="forgot-row">
          <a class="back-link" href="forgot-password.html">Quên mật khẩu?</a>
        </p>

        <button class="btn-login" type="submit" id="submitBtn">
          <span class="btn-text">Đăng nhập</span>
        </button>
        <p class="demo-hint">Tài khoản demo: <strong>nongdan</strong> / <strong>123456</strong></p>
      </form>

      <p class="back-row"><a class="back-link" href="index.html">Quay lại</a></p>
      <p class="signup-row">Chưa có tài khoản? <a class="back-link" href="register.html">Đăng ký ngay</a></p>
    </section>
  </main>

  <svg class="wave" viewBox="0 0 1440 160" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#8ecf9a" d="M0 96c190-58 360 22 560 10s330-86 530-72 260 78 350 66v160H0V96Z"/>
    <path fill="#1b6b38" d="M0 132c210-52 350 18 570 14s340-70 540-58 250 62 330 54v120H0v-10Z"/>
  </svg>

  <svg class="deco-branch" viewBox="0 0 220 220" aria-hidden="true">
    <g fill="#7cc489">
      <ellipse cx="150" cy="60" rx="16" ry="34" transform="rotate(28 150 60)"/>
      <ellipse cx="178" cy="96" rx="15" ry="32" transform="rotate(58 178 96)"/>
      <ellipse cx="128" cy="34" rx="13" ry="27" transform="rotate(-4 128 34)"/>
      <ellipse cx="196" cy="134" rx="13" ry="27" transform="rotate(84 196 134)"/>
      <ellipse cx="104" cy="30" rx="11" ry="24" transform="rotate(-38 104 30)"/>
    </g>
    <path fill="none" stroke="#5fae6e" stroke-width="4" stroke-linecap="round" d="M96 210c26-46 52-84 88-118"/>
  </svg>

  <figure class="expert-badge">
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <circle cx="48" cy="48" r="46" fill="#ffffff"/>
      <circle cx="48" cy="48" r="46" fill="none" stroke="#dfe9df" stroke-width="2"/>
      <path fill="#1b6b38" d="M48 86c-14 0-26-6-31-15 3-11 16-17 31-17s28 6 31 17c-5 9-17 15-31 15Z"/>
      <circle cx="48" cy="40" r="16" fill="#f6dfc4"/>
      <path fill="#2f3a33" d="M32 36c0-11 7-17 16-17s16 6 16 17c0-4-6-6-16-6s-16 2-16 6Z"/>
      <g fill="none" stroke="#2f3a33" stroke-width="2.4">
        <circle cx="41" cy="40" r="5"/>
        <circle cx="55" cy="40" r="5"/>
        <path stroke-linecap="round" d="M46 40h4M36 40h-3M60 40h3"/>
      </g>
      <path fill="none" stroke="#c2d6c4" stroke-width="2.4" stroke-linecap="round" d="M42 52c4 3 8 3 12 0"/>
    </svg>
    <figcaption class="visually-hidden">Chuyên gia hỗ trợ nông nghiệp</figcaption>
  </figure>

  <div class="toast" id="toast" hidden></div>

  <script src="js/login.js"></script>
</body>
</html>
